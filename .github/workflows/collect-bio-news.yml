name: Collect Bioinformatics News

on:
  schedule:
    - cron: '17 0 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the collector
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Collect news candidates
        run: python3 experiments/v4/scripts/collect-bio-news.py "$RUNNER_TEMP/bio-news-candidates.json"
      - name: Save candidates for editors
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: bio-news-candidates
          path: ${{ runner.temp }}/bio-news-candidates.json
          retention-days: 14
